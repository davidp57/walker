name: CD - standalone .exe

# CHR-009 / TEC-021: builds the standalone Windows program (PyInstaller) in both packagings.
# Mirrors exactly the steps verified locally with scripts/build-exe.ps1 (frontend build -> pip
# install -> pyinstaller, twice).
#
# Two artifacts, because a onefile executable unpacks its own appended archive and runs code from
# it at startup — indistinguishable from a packer to an antivirus heuristic. Defender quarantined
# the v1.14.0 walker.exe on that behavior, killing the running process mid-request. The onedir zip
# does no self-extraction, so the user has something else to try. Neither is claimed to be immune.
#
# Version tags publish both to the GitHub Release. Pushes to develop only build them and keep them
# as workflow artifacts (retained by GitHub Actions, downloadable from the run) so either can be
# smoke-tested ahead of a release, without creating one.
on:
  push:
    tags:
      - "v*"
    branches:
      - develop

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install walker + PyInstaller
        run: pip install -e ".[build-exe]"

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the onefile .exe
        env:
          WALKER_BUILD_MODE: onefile
        run: pyinstaller walker.spec --noconfirm

      - name: Build the onedir folder
        env:
          WALKER_BUILD_MODE: onedir
        run: pyinstaller walker.spec --noconfirm

      - name: Zip the onedir build
        shell: pwsh
        # Zip dist/walker itself, not its contents, so the archive holds one top-level folder and
        # unzipping never scatters files.
        run: Compress-Archive -Path dist/walker -DestinationPath "dist/walker-${{ steps.version.outputs.version }}-windows.zip"

      - name: Upload both artifacts (develop)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: walker-standalone
          path: |
            dist/walker.exe
            dist/walker-*-windows.zip

      - name: Attach both to the GitHub Release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/walker.exe
            dist/walker-*-windows.zip
          body_path: RELEASE_NOTES.md
